<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="こんだてメモ">
<meta name="theme-color" content="#e8742c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>こんだてメモ</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--sub:#7a7066;--ac:#e8742c;--ac2:#fde9d9;--bd:#eadfd2}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#26221e;--tx:#f1ebe4;--sub:#a99f94;--ac:#f08a4b;--ac2:#3a2a1f;--bd:#3a342d}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--sub);font-size:13px;margin:0 0 16px}
.top{display:flex;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac2);color:var(--ac);font-weight:600}
button.main{background:var(--ac);color:#fff;width:100%;padding:14px}
button:disabled{opacity:.5}.step{width:40px;height:40px;padding:0;font-size:22px}
.gear{background:transparent;font-size:22px;padding:4px 8px}
.ib{padding:4px 10px;font-size:14px}
.num{font-size:22px;font-weight:700;min-width:64px;text-align:center}
input[type=text],input[type=password],select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:8px}
.row input{margin:0;flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--ac2);color:var(--ac);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.q{background:transparent;border:1px dashed var(--bd);color:var(--sub);font-weight:400}
.hint{color:var(--sub);font-size:13px;margin:8px 0 0}
details{border-top:1px solid var(--bd);padding:10px 0}details:first-of-type{border-top:0}
summary{font-weight:700}summary small{color:var(--sub);font-weight:400;margin-left:6px}
ol{padding-left:20px;margin:8px 0}.tip{background:var(--ac2);border-radius:10px;padding:8px 10px;font-size:14px}
.ing{color:var(--sub);font-size:14px}.cat{font-size:13px;color:var(--sub);margin:12px 0 4px;font-weight:700}
label.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
label.it input{width:22px;height:22px;accent-color:var(--ac)}label.it.on span{text-decoration:line-through;color:var(--sub)}
.amt{margin-left:auto;color:var(--sub);font-size:14px;text-align:right}
.ed{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ed input{margin:0}.ed input:first-child{flex:2 1 120px}.ed input:nth-child(2){flex:1 1 80px}
.err{color:#c0392b;font-size:14px;margin:8px 0 0}
.hist{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border-bottom:1px solid var(--bd);border-radius:0;font-weight:400;font-size:14px}
#sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:calc(env(safe-area-inset-top) + 8px) 16px 40px}
#sheet>div,#sheet>section,#sheet>p{max-width:560px;margin-left:auto;margin-right:auto}
</style></head>
<body><main>
<div class="top"><h1>🍳 こんだてメモ</h1><div class="sp"></div><button class="gear" id="gear" aria-label="設定">⚙️</button></div>
<p class="sub">献立と人数を入れるだけ。レシピと買い物リストを自動で作ります。</p>

<section class="card"><h2>何人分？</h2>
<div class="row"><button class="step" id="minus">−</button><div class="num" id="ppl"></div><button class="step" id="plus">＋</button></div></section>

<section class="card"><h2>献立（空欄ならお任せ）</h2>
<div class="row"><input type="text" id="dish" placeholder="例：豚の生姜焼き" enterkeyhint="done"><button id="add">追加</button></div>
<div class="chips" id="picked"></div><div class="chips" id="quick"></div>
<p class="hint" id="hint"></p></section>

<button class="main" id="go">レシピと買い物リストを作る</button>
<p class="err" id="err" hidden></p>
<div id="rec" style="margin-top:14px"></div>
<div id="shop"></div>
<section class="card" id="histc" hidden><div class="row"><h2>🕘 履歴</h2><div class="sp"></div><button id="clr">消す</button></div><div id="hist"></div></section>
</main>

<div id="sheet" hidden>
  <div class="top"><h1>⚙️ 設定</h1><div class="sp"></div><button id="close">閉じる</button></div>
  <section class="card" style="margin-top:12px"><h2>AIの利用設定（最初に一度だけ）</h2>
    <p class="hint" style="margin-top:0">レシピの自動作成には、Googleの無料APIキーが必要です。aistudio.google.com で作成して、下に貼り付けてください。キーはこのiPhoneの中にだけ保存されます。</p>
    <input type="password" id="key" placeholder="APIキーを貼り付け" autocomplete="off" autocapitalize="off">
    <select id="model"></select>
    <button id="test" style="margin-top:8px;width:100%">接続テスト</button>
    <p class="hint" id="st"></p>
    <p class="err" id="serr" hidden></p>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const STAPLE='常備品（家にあるか確認）',MANUAL='自分で追加';
const DEF={people:2,dishes:[],plan:null,key:'',model:'auto',list:[],shop:[],used:'',history:[],v4:true};
let S=JSON.parse(JSON.stringify(DEF)),editId=null,focusAdd=false,uid=0;
const nid=()=>Date.now().toString(36)+(uid++);
const save=()=>{try{localStorage.setItem('kondate2',JSON.stringify(S))}catch(e){}};

function shopFrom(plan,checked){
  const m=new Map();
  (plan.dishes||[]).forEach(d=>(d.ingredients||[]).forEach(x=>{
    if(!x.name)return;
    if(!m.has(x.name))m.set(x.name,{name:x.name,amt:[],cat:x.staple?STAPLE:(x.category||'その他'),done:!!(checked&&checked[x.name])});
    m.get(x.name).amt.push(x.amount);
  }));
  return[...m.values()].map(v=>({id:nid(),name:v.name,amt:v.amt.filter(Boolean).join(' + '),cat:v.cat,done:v.done,manual:false}));
}
function applyPlan(plan){S.plan=plan;S.shop=S.shop.filter(i=>i.manual).concat(shopFrom(plan))}

let old=null;try{old=JSON.parse(localStorage.getItem('kondate2')||'null')}catch(e){}
if(old){
  S=Object.assign(S,old);
  if(!old.v4){
    S.key=(old.keys&&old.keys.gemini)||'';S.model='auto';S.list=(old.lists&&old.lists.gemini)||[];
    S.shop=old.plan?shopFrom(old.plan,old.checked||{}):[];S.used='';S.v4=true;
    ['keys','models','lists','provider','checked'].forEach(k=>delete S[k]);
  }
}

/* ---------- 入力 ---------- */
function renderInput(){
  $('#ppl').textContent=S.people+'人';
  $('#hint').textContent=S.dishes.length?'':'献立が未定なら、このまま作成を押すと主菜・副菜・汁物を提案します。';
  const p=$('#picked');p.textContent='';
  S.dishes.forEach((d,i)=>{const c=h('span','chip',d+' ×');c.onclick=()=>{S.dishes.splice(i,1);save();renderInput()};p.append(c)});
  const q=$('#quick');q.textContent='';
  ['カレー','肉じゃが','親子丼','餃子','味噌汁'].filter(x=>!S.dishes.includes(x)).forEach(x=>{const c=h('span','chip q','+ '+x);c.onclick=()=>{S.dishes.push(x);save();renderInput()};q.append(c)});
}
function addDish(){const v=$('#dish').value.trim();if(v&&S.dishes.length<8){S.dishes.push(v);$('#dish').value='';save();renderInput()}}
$('#add').onclick=addDish;$('#dish').onkeydown=e=>{if(e.key==='Enter')addDish()};
$('#minus').onclick=()=>{S.people=Math.max(1,S.people-1);save();renderInput()};
$('#plus').onclick=()=>{S.people=Math.min(12,S.people+1);save();renderInput()};

/* ---------- レシピ ---------- */
function renderRecipes(){
  const o=$('#rec');o.textContent='';const plan=S.plan;
  if(!plan||!Array.isArray(plan.dishes))return;
  const rc=h('section','card');rc.append(h('h2',null,'📖 レシピ（'+(plan.people||S.people)+'人分）'));
  plan.dishes.forEach((d,i)=>{
    const dt=h('details');if(i===0)dt.open=true;
    const s=h('summary',null,d.name||'料理');if(d.minutes)s.append(h('small',null,'約'+d.minutes+'分'));dt.append(s);
    if(d.tip)dt.append(h('div','tip','💡 '+d.tip));
    dt.append(h('div','ing','材料：'+(d.ingredients||[]).map(x=>x.name+' '+x.amount).join('、')));
    const ol=h('ol');(d.steps||[]).forEach(t=>ol.append(h('li',null,t)));dt.append(ol);rc.append(dt);
  });
  o.append(rc);
}

/* ---------- 買い物リスト（編集・追加OK） ---------- */
const groupOf=items=>{const g={};items.forEach(i=>(g[i.cat]=g[i.cat]||[]).push(i));return g};
const rank=c=>c===MANUAL?0:c===STAPLE?2:1;
function itemRow(i){
  const l=h('label','it'+(i.done?' on':'')),cb=h('input');cb.type='checkbox';cb.checked=i.done;
  cb.onchange=()=>{i.done=cb.checked;save();renderShop()};
  const ed=h('button','ib','✎');ed.onclick=e=>{e.preventDefault();editId=i.id;renderShop()};
  l.append(cb,h('span',null,i.name),h('span','amt',i.amt),ed);return l;
}
function editRow(i){
  const w=h('div','ed'),n=h('input'),a=h('input');
  n.type='text';n.value=i.name;a.type='text';a.value=i.amt;a.placeholder='量';
  const sv=h('button','ib','保存'),dl=h('button','ib','削除'),cc=h('button','ib','やめる');
  sv.onclick=()=>{const v=n.value.trim();if(v){i.name=v;i.amt=a.value.trim()}editId=null;save();renderShop()};
  dl.onclick=()=>{S.shop=S.shop.filter(x=>x!==i);editId=null;save();renderShop()};
  cc.onclick=()=>{editId=null;renderShop()};
  w.append(n,a,sv,dl,cc);return w;
}
function renderShop(){
  const o=$('#shop');o.textContent='';
  const sc=h('section','card'),hd=h('div','row'),left=S.shop.filter(i=>!i.done).length;
  hd.append(h('h2',null,'🛒 買い物リスト'),h('div','sp'),h('span','ing',S.shop.length?'残り '+left+'/'+S.shop.length:''));sc.append(hd);
  const g=groupOf(S.shop);
  Object.keys(g).sort((a,b)=>rank(a)-rank(b)).forEach(cat=>{
    sc.append(h('div','cat',cat));
    g[cat].forEach(i=>sc.append(i.id===editId?editRow(i):itemRow(i)));
  });
  if(!S.shop.length)sc.append(h('p','hint','まだありません。下から自分で追加できます。'));
  const f=h('div','row');f.style.marginTop='12px';
  const n=h('input'),a=h('input'),b=h('button',null,'追加');
  n.type='text';n.placeholder='買うものを追加（例：牛乳）';n.enterKeyHint='done';
  a.type='text';a.placeholder='量';a.style.flex='0 0 64px';
  const add=()=>{const v=n.value.trim();if(!v)return;S.shop.push({id:nid(),name:v,amt:a.value.trim(),cat:MANUAL,done:false,manual:true});focusAdd=true;save();renderShop()};
  b.onclick=add;n.onkeydown=e=>{if(e.key==='Enter')add()};a.onkeydown=n.onkeydown;
  f.append(n,a,b);sc.append(f);
  const act=h('div','row');act.style.marginTop='12px';
  const cl=h('button',null,'チェック済みを消す');cl.onclick=()=>{S.shop=S.shop.filter(i=>!i.done);save();renderShop()};
  const cp=h('button',null,'コピー');
  cp.onclick=async()=>{
    const gg=groupOf(S.shop.filter(i=>!i.done));
    const t='🛒買い物リスト\n'+Object.keys(gg).sort((x,y)=>rank(x)-rank(y)).map(c=>'【'+c+'】\n'+gg[c].map(v=>'□ '+v.name+(v.amt?' '+v.amt:'')).join('\n')).join('\n');
    try{await navigator.clipboard.writeText(t);cp.textContent='コピーしました ✓'}catch(e){cp.textContent='コピーできませんでした'}
  };
  act.append(cl,cp);sc.append(act);o.append(sc);
  if(focusAdd){n.focus();focusAdd=false}
}

/* ---------- 履歴 ---------- */
function renderHist(){
  $('#histc').hidden=!S.history.length;const el=$('#hist');el.textContent='';
  S.history.forEach(it=>{
    const d=new Date(it.t),b=h('button','hist',(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' ・ '+it.plan.dishes.map(x=>x.name).join('、')+'（'+it.people+'人）');
    b.onclick=()=>{applyPlan(Object.assign({people:it.people},it.plan));save();renderRecipes();renderShop();window.scrollTo({top:$('#rec').offsetTop-8,behavior:'smooth'})};el.append(b);
  });
}
$('#clr').onclick=()=>{S.history=[];save();renderHist()};

/* ---------- AI（Gemini） ---------- */
class ApiErr extends Error{constructor(s,d){super(s+' '+d);this.status=s;this.detail=d}}
async function fail(r){let d='';try{const j=await r.json();d=(j.error&&j.error.message)||''}catch(e){}throw new ApiErr(r.status,d.slice(0,160))}
const gHead=()=>({'x-goog-api-key':S.key});
async function listModels(){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:gHead()});
  if(!r.ok)await fail(r);
  const j=await r.json();
  return(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/^models\/gemini-/.test(m.name)&&!/image|tts|embedding|live|audio|robotics|computer-use|vision|exp/.test(m.name))
    .map(m=>({id:m.name.replace('models/',''),label:m.displayName||m.name.replace('models/','')}));
}
function rankModels(list){
  const sc=id=>{const v=parseFloat((id.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);const f=/flash-lite/.test(id)?1:/flash/.test(id)?2:0;return(/preview/.test(id)?0:1)*1000+v*10+f};
  return list.map(m=>m.id).filter(id=>/flash/.test(id)).sort((a,b)=>sc(b)-sc(a));
}
async function callGemini(p,model){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},gHead()),body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:{responseMimeType:'application/json'}})});
  if(!r.ok)await fail(r);
  const j=await r.json();return j.candidates?.[0]?.content?.parts?.[0]?.text||'';
}
function parse(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');const o=JSON.parse(t.slice(a,b+1));if(!Array.isArray(o.dishes)||!o.dishes.length)throw new Error('empty');return o}
async function candidates(){
  if(S.model!=='auto')return[S.model];
  if(!S.list.length){S.list=await listModels();save();renderModels()}
  return rankModels(S.list).slice(0,4);
}
const SHAPE='JSONのみ出力（説明文やコードブロックは不要）：{"dishes":[{"name":"料理名","minutes":30,"tip":"おいしく作るコツ1文","steps":["手順"],"ingredients":[{"name":"食材","amount":"2個","category":"野菜|肉・魚|卵・乳製品|豆腐・加工品|主食・乾物|調味料|その他","staple":false}]}]}。staple は醤油・塩・砂糖・油・みりん等の常備調味料のときtrue。同じ食材は同じ名前で統一。';
const buildPrompt=()=>'あなたは家庭料理に詳しい料理研究家です。'+S.people+'人分の夕食について、'+(S.dishes.length?'次の献立のレシピ：'+S.dishes.join('、'):'献立が未定なので、主菜・副菜・汁物の3品を提案（栄養バランスと作りやすさ重視）')+'。おいしく失敗しにくいレシピで、手順は各4〜6個で簡潔に。分量は'+S.people+'人分で、買い物しやすい単位（個・本・g・パック等）で。'+SHAPE;
function showErr(e,el){
  const s=e&&e.status,d=e&&e.detail?'（'+e.detail+'）':'',m=String((e&&e.message)||e);
  el.textContent=s===400||s===401||s===403?'APIキーが正しくないか、使えない状態です'+d
    :s===404?'モデルが見つかりません。設定でモデルを「自動」にしてください'+d
    :s===429?'無料枠の上限に達したようです。少し待ってからお試しください'+d
    :m.includes('Failed to fetch')?'通信できませんでした。ネットワークを確認してください。'
    :'うまく作れませんでした：'+m;
  el.hidden=false;
}
async function generate(){
  const err=$('#err'),btn=$('#go');err.hidden=true;
  if(!S.key){openSheet('レシピの自動作成には、最初に一度だけキーの設定が必要です。');return}
  btn.disabled=true;btn.textContent='レシピを考え中…';
  try{
    const ids=await candidates();
    if(!ids.length)throw new Error('使えるモデルが見つかりませんでした。');
    let text='',used='',last;
    for(const id of ids){
      try{text=await callGemini(buildPrompt(),id);used=id;break}
      catch(e){last=e;if(![404,429,500,503].includes(e.status))throw e}
    }
    if(!used)throw last;
    const plan=parse(text);plan.people=S.people;S.used=used;
    applyPlan(plan);
    S.history.unshift({t:Date.now(),people:S.people,plan:{dishes:plan.dishes}});S.history=S.history.slice(0,10);
    save();renderRecipes();renderShop();renderHist();$('#rec').scrollIntoView({behavior:'smooth'});
  }catch(e){showErr(e,err)}
  btn.disabled=false;btn.textContent='レシピと買い物リストを作る';
}
$('#go').onclick=generate;

/* ---------- 設定画面 ---------- */
function renderModels(){
  const sel=$('#model');sel.textContent='';
  const o=document.createElement('option');o.value='auto';o.textContent='モデル：自動（おすすめ）';sel.append(o);
  S.list.forEach(m=>{const e=document.createElement('option');e.value=m.id;e.textContent=m.label+'（'+m.id+'）';sel.append(e)});
  sel.value=S.model;if(sel.value!==S.model){sel.value='auto';S.model='auto'}
}
function renderStatus(){$('#st').textContent=(S.key?'キー：設定済み ✓':'キー：未設定')+(S.used?'　最後に使ったモデル：'+S.used:'')}
function openSheet(msg){$('#serr').hidden=true;renderModels();renderStatus();if(msg){$('#serr').textContent=msg;$('#serr').hidden=false}$('#sheet').hidden=false;$('#sheet').scrollTop=0}
$('#gear').onclick=()=>openSheet();
$('#close').onclick=()=>{$('#sheet').hidden=true};
$('#key').oninput=e=>{S.key=e.target.value.trim();save();renderStatus()};
$('#model').onchange=e=>{S.model=e.target.value;save()};
$('#test').onclick=async()=>{
  const er=$('#serr'),b=$('#test');er.hidden=true;
  if(!S.key){er.textContent='先にAPIキーを貼り付けてください。';er.hidden=false;return}
  b.disabled=true;b.textContent='確認中…';
  try{S.list=await listModels();save();renderModels();b.textContent='✓ キーは有効です（モデル'+S.list.length+'件を取得）'}
  catch(e){b.textContent='接続テスト';showErr(e,er)}
  b.disabled=false;
};
$('#key').value=S.key;

renderInput();renderRecipes();renderShop();renderHist();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
